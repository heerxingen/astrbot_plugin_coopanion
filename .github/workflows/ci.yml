name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  plugin:
    name: AstrBot plugin
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip httpx
      - name: Byte-compile
        run: python -m py_compile main.py client.py tests/smoke_client.py
      - name: Client smoke test against a fake bridge
        env:
          PYTHONIOENCODING: utf-8
        run: python tests/smoke_client.py

  extension:
    name: Coopanion extension
    runs-on: windows-latest
    defaults:
      run:
        working-directory: coopanion-extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: coopanion-extension/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck against the cortico API
        run: npm run typecheck
      - name: describe.json is up to date
        run: |
          npm run describe
          git diff --exit-code -- describe.json
      - name: Parse the PowerShell engine
        shell: pwsh
        run: |
          $failed = $false
          foreach ($f in Get-ChildItem scripts/*.ps1) {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errors)
            if ($errors) { $errors | ForEach-Object { Write-Error "$($f.Name): $_" }; $failed = $true }
          }
          if ($failed) { exit 1 }
          Write-Host "ps1 syntax ok"
